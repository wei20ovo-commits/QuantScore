  inherited_source_text_v1_1: '字段

    规范

    最大分值/扣分

    最高+8；F类总分仍封顶15

    自动化级别

    AUTO_PROXY

    规则来源

    用户补充定义：低成交量涨停后进入高位，随后2~6日整理；整理量显著大于此前拉升量；允许下跌但盘中不得跌破M5；整理越短越强；之后继续上涨

    笔记依据

    笔记“空中加油” + 用户补充（v1.1）

    1）规则目的：识别“低量涨停启动→高位2~6日放量换手整理→M5不破→再次上涨”的高位中继，而不是把它误作新的底部启动。

    2）所需数据：daily OHLCV、M5、limit_up_price、volume_ratio_20、HIGH_ZONE或20日累计涨幅。

    3）观察窗口：初始低量涨停日t0后2~6个交易日整理，随后检查第3~7日是否出现继续上涨；整理长度严格2~6日，越短强度越高。

    4）前置条件：t0必须真实/接近涨停且成交量较小；随后股价已进入相对高位。V1默认 low_volume_limit = volume_ratio_20[t0]<=1.2（工程阈值）；high_context
    = HIGH_ZONE=True 或 return_20d>=15%。

    5）精确定义/公式：rise_volume_ref = mean(volume of max(1,t0-2)..t0)；对L∈{2,3,4,5,6}，consolidation=t0+1..t0+L；m5_integrity
    = all(low_adj[d]>=M5[d])；consolidation_volume_ratio=mean(volume during consolidation)/rise_volume_ref；large_exchange
    = consolidation_volume_ratio>=1.20（工程阈值，表示整理量大于此前拉升量）；continuation = close[t0+L+1]
    > max(high during consolidation) 或 (daily_return[t0+L+1]>=5% 且 close>M5)。选择最早满足continuation的L，因此天然体现“整理越短越强”。

    6）判定步骤：先找低量涨停t0；确认进入高位环境；从2日整理开始逐步扩展到6日，每天检查low是否破M5和整理均量是否高于rise_volume_ref；首次出现向上突破整理区即确认空中加油完成。

    7）评分/扣分分档：

    条件

    得分/扣分

    2日整理后继续上涨，且整理量放大、M5未破

    +8

    3~4日整理后继续上涨，且整理量放大、M5未破

    +7

    5~6日整理后继续上涨，且整理量放大、M5未破

    +6

    已整理2~6日且M5未破，但尚未继续上涨

    CANDIDATE +3

    任一日low<M5或>6日未继续上涨

    0 / INVALIDATED或EXPIRED

    8）失效与 UNKNOWN：整理期任一日 low<M5=>立即INVALIDATED；超过6日仍未继续上涨=>EXPIRED；t0量能、M5、涨停价缺失=>UNKNOWN。

    9）冲突与去重规则：F3属于“高位中继”，可发生在更早的F1启动之后，但F类总分始终封顶15；同一交易日不得同时把F3再次当F1启动计分。

    10）解释模板：低量涨停后在高位整理 {L} 日，整理期均量为此前拉升阶段的 {exchange_ratio:.2f} 倍，最低价始终未破M5；第 {L_plus_1}
    日重新向上，F3 得 {score}/8 分。'
  v1_2_override: '用户定义：


    第一阶段：


    出现涨停，

    且涨停时成交量较小。


    之后股票进入较高位置。


    进入整理阶段：


    整理持续2~6个交易日。


    整理阶段相对于此前拉升阶段：

    成交量明显更大。


    这几天股价允许下跌，

    但是：


    任何一天 Low < M5


    则空中加油结构立即 INVALIDATED。


    即使收盘重新站回M5也不能恢复。


    整理结束以后继续上涨：

    结构成立。


    强度按照整理时间：


    2日整理后重新上涨：

    +8


    3~4日：

    +7


    5~6日：

    +6


    已经进入合法整理但尚未再次上涨：

    CANDIDATE

    +3


    超过6日没有重新启动：

    结构失效。


    “继续上涨”使用规范已有突破/上涨确认规则，

    不得只因为单日微涨0.1%判定重新启动。


    实现 F3。'
