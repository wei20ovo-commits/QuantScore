  definition: hard_break[d] = low_adj[d] < M5[d]。任一交易日 hard_break=True 即 N板失效；判断只看盘中最低价是否破M5，不因close重新站回而恢复。
  steps: 换手期逐日比较low与当日M5；首次出现low<M5时记录break_date、break_low、m5_value并立即终止该N板候选。
  source_note: 笔记第14页 + 用户补充（v1.1）
  source_text: '字段

    规范

    最大分值/扣分

    -8

    自动化级别

    AUTO

    规则来源

    用户明确补充：N板换手期只要盘中最低价跌破M5，即使收盘收回也算失效

    笔记依据

    笔记第14页 + 用户补充（v1.1）

    1）规则目的：对F1-N换手期执行硬失效约束，不再保留“盘中破M5可恢复”的软分支。

    2）所需数据：F1-N candidate、low_adj、M5。

    3）观察窗口：首次启动后的2~6日换手期。

    4）前置条件：已存在F1-N first_start并处于exchange阶段。

    5）精确定义/公式：hard_break[d] = low_adj[d] < M5[d]。任一交易日 hard_break=True 即 N板失效；判断只看盘中最低价是否破M5，不因close重新站回而恢复。

    6）判定步骤：换手期逐日比较low与当日M5；首次出现low<M5时记录break_date、break_low、m5_value并立即终止该N板候选。

    7）评分/扣分分档：

    8）失效与 UNKNOWN：M5或low缺失=>UNKNOWN；不存在N板候选=>NOT_APPLICABLE。

    9）冲突与去重规则：R11触发必须先将F1-N正分清零并标记INVALIDATED，再扣-8；同一N板事件只扣一次。

    10）解释模板：N板换手第 {day_no} 日盘中最低价 {low:.2f} 低于M5 {m5:.2f}，即使收盘重新站回也按用户规则判定失效，R11=-8。







