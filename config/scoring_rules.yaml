  - R11触发必须先将F1-N正分清零并标记INVALIDATED，再扣-8；同一N板事件只扣一次。
  explanation_template: N板换手第 {day_no} 日盘中最低价 {low:.2f} 低于M5 {m5:.2f}，即使收盘重新站回也按用户规则判定失效，R11=-8。
  spec_version: '1.4'
  spec_status: FROZEN_V1_4
