    9）冲突与去重规则：F1-T只评价“T形+最终涨停”；位置由F2、异常成交由R12、高位风险由R1/R3处理，避免重复编码。

    10）解释模板：当日最终封涨停，收盘位于全天区间顶部 {close_position:.1%}，下影线/实体比={shadow_body_ratio:.2f}，T形状态={t_shape}，F1-T
