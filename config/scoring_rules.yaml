  inherited_source_text_v1_1: '字段

    规范

    最大分值/扣分

    +4

    自动化级别

    AUTO_PROXY

    规则来源

    用户补充定义：连续7日或以上温和小阳，中间最多夹1根小阴/十字星，不允许大阳；是否真正启动不以单纯站上M60判断，而要站上M60并继续突破起飞平台

    笔记依据

    笔记第7页 + 用户补充（v1.1）

    1）规则目的：识别底部持续、温和、非暴力拉升的吸筹型“小连阳”，并与真正“起飞启动”分开。

    2）所需数据：open_adj、high_adj、low_adj、close_adj、M60、C5.platform_high、position_120。

    3）观察窗口：从最近60个交易日中寻找最长连续候选段；策略要求候选段长度>=7日，无固定最大持续天数；60日只是工程扫描窗口。

    4）前置条件：候选段开始时应处于底部/低位阶段：LOW_ZONE=True，或尚未满足“close>M60 且 close>C5.platform_high”的正式启动条件。

    5）精确定义/公式：bull_day = close>open；doji_or_small_bear = close<=open 且 abs(close/open-1)<=E1.small_negative_abs_max；big_bull
    = (close/open-1)>=E1.big_bull_body_min 或 daily_return>=E1.big_bull_return_min。一个有效连续段要求
    length>=7、big_bull_count=0、doji_or_small_bear_count<=1，其余交易日均为 bull_day。用户未给“小阳”的固定涨幅上限，因此V1不以3%封顶；只排除配置化“大阳线”。默认工程阈值
    small_negative_abs_max=2%、big_bull_body_min=5%、big_bull_return_min=7%。started
    = close>M60 且 C5.platform_high存在 且 close>C5.platform_high。

    6）判定步骤：在最近60日中枚举连续段；剔除包含大阳线或超过1根小阴/十字星的段；优先选择最长且结束日期最近的有效段；额外输出该段当前是否已正式started。

    7）评分/扣分分档：

    8）失效与 UNKNOWN：长度<7只能 CANDIDATE、不得得分；若出现大阳线则当前“小连阳段”在该日前结束；C5.platform_high不可得时仍可识别E1，但
    started 状态=UNKNOWN。

    9）冲突与去重规则：E1可以跨过M60继续存在，但一旦 close>M60 且突破C5平台上沿，后续阶段归入启动规则，E1不再为新日期持续累加。

    10）解释模板：连续 {run_len} 日中有 {bull_count} 根温和阳线、{small_nonbull_count} 根小阴/十字星、0根大阳线；正式启动状态={started}，E1
    得 {score}/4 分。









