    每个周期都使用：


    “收盘价形成的波谷”


    不是最低价 Low。


    安全带由至少两个已确认的收盘价局部波谷连线形成。


    局部收盘波谷：

    当前周期 Close 小于前后各2根K线的 Close。


    最近两个已确认波谷：

    按时间最近的两个有效波谷建立上升支撑线。


    只有：


    第二个波谷收盘价 > 第一个波谷收盘价


    才属于上升安全带。


    将两点连线外推到当前评价周期。


    判断破位时：


    盘中 Low 跌破安全带但 Close 收回：

    不算失效。


    只有当前周期：


    Close < 安全带价格


    才判该周期安全带跌破。


    日K：

    使用日收盘。


    周K：

    只能在完整周线收盘后确认。


    月K：

    只能在完整月线收盘后确认。


    任何周期出现正式收盘跌破：

