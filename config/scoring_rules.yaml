  inherited_source_text_v1_1: '字段

    规范

    最大分值/扣分

    +4

    自动化级别

    AUTO_PROXY

    规则来源

    用户补充定义：股票长期/短期均可在M60上方不远处小幅波动；无固定持续时间；起飞前可故意跌破M60，但1~3日内重新站回视为洗盘；平台突破不要求明显放量

    笔记依据

    笔记第10页 + 用户补充（v1.1）

    1）规则目的：识别“贴近M60、总体稳定在M60上方的小幅整理平台”，并允许一次或多次1~3日内快速收复M60的洗盘事件。

    2）所需数据：close_adj、high_adj、low_adj、M60。

    3）观察窗口：策略本身无最短/最长持续时间。工程实现从最近250个交易日向前搜索“结束于当前或最近5日”的最大连续平台段；250日仅为性能扫描上限，不是交易定义。

    4）前置条件：M60可计算；至少存在3个连续交易日用于构成可识别的“平台段”（3日仅为算法最低样本量，不代表策略要求）。

    5）精确定义/公式：near_m60_day = M60 <= close <= M60*(1+C5.near_m60_upper_pct)；platform_width=(max(close_segment)-min(close_segment))/median(close_segment)；washout_episode
    = close<M60 后在1~3个交易日内重新 close>=M60；允许 washout_episode 计入平台，但任何一次连续3日后仍未收复M60即终止平台。默认工程参数
    near_m60_upper_pct=8%、platform_width_max=15%。platform_high=max(high of platform
    excluding washout days)。platform_breakout = close>platform_high 且 close>M60；不设置成交量必要条件。

    6）判定步骤：从当前向前搜索满足“多数日贴近M60、小幅波动”的最长连续段；遇到跌破M60时启动3日收复计时器；1~3日内收复则继续同一平台，超过3日未收复则平台在跌破日前结束；最后计算平台上沿及是否已突破。

    7）评分/扣分分档：

    8）失效与 UNKNOWN：M60不可算=>UNKNOWN；连续跌破M60且3个交易日内未收复=>原平台 TERMINATED；平台突破后本规则仍可保留“历史平台已形成”状态，但后续启动由F类规则评价。

    9）冲突与去重规则：C5不要求突破时放量，D1只能额外评价“若有放量是否健康”；C4的快速收复M60与C5 washout可同时记录，但同一收复事件只生成一个
    event_id。

    10）解释模板：检测到持续 {platform_len} 日的M60附近平台，平台宽度 {width:.1%}；期间洗盘次数 {washout_count}，最长
    {max_reclaim_days} 日收复；当前突破状态={breakout_status}，C5 得 {score}/4 分。







    条件

