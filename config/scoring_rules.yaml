        单日假摔签名刚发生，尚无足够后续日

        CANDIDATE，0分

        签名成立但3日内未恢复

        0 / INVALIDATED

        缺涨跌停价或关键数据

        UNKNOWN'
    source_text: '现在补全“龙门”的定义。


      龙门不是单独M60，

      也不是单独前高。


      龙门 =


      “前期重要高点形成的压力连线”

      与

      “M60”

      在同一价格区域形成的共同压力区。


      步骤：


      1. 在突破日前寻找至少两个已经确认的局部重要高点；

      2. 高点必须发生在突破日前，禁止使用未来数据；

      3. 使用距离突破日最近的两个有效重要高点建立压力线；

      4. 将压力线外推到突破日；

      5. 计算：


      resistance_price

      m60_price


      共同区间要求：


      abs(resistance_price - m60_price)

      /

      m60_price

      <= 3%


      参数：


      dragon_gate_confluence_pct = 0.03


      只有满足共同区间，

      才存在有效“龙门”。


      “跃龙门”：


      突破日 Close 同时高于：


      resistance_price

      和

      M60


      并满足规范中的强势突破要求。


      若多个可能压力线候选：

      优先使用距离突破日最近的一组合法高点组合。


      假摔按照用户已冻结定义：


      发生在跃龙门之后。


      假摔只持续：


      1个交易日。


      特征：


      1. 开盘价接近涨停价；

      2. 收盘价接近跌停价；

      3. 当日跌幅很大；

      4. 当日成交量巨大。


      使用规范现有“接近涨停/接近跌停/巨大成交量”参数；

      如果这些参数存在端点歧义，按左闭右开规则消除。


      必须完整保留后续恢复确认逻辑，

      防止真实出货被误判为假摔。


      实现 F1-Y。'
