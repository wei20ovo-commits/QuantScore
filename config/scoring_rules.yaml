  spec_status: FROZEN_V1_4
  code_status: NOT_IMPLEMENTED
  evaluator: null
  definition: excess_1d = sector_return_1d - benchmark_return_1d
  steps: 计算板块等权或数据源板块指数收益；计算相对大盘超额收益。
  source_note: 笔记第4页
  source_text: '字段

