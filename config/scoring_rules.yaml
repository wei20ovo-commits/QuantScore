    3）观察窗口：日线默认最近120日、周线最近52周、月线最近36月作为工程搜索窗口；窗口仅用于寻找波谷，不限制安全带实际持续时间。

    4）前置条件：某周期至少存在2个“已确认收盘波谷”；实时模式的最新波谷只有在右侧确认窗口完成后才可从 CANDIDATE 升级为 CONFIRMED。

    5）精确定义/公式：LOCAL_CLOSE_TROUGH_D[t]: close[t] <= close[t-2:t+2]全部值；周/月线用前后各1根K线确认。取最近两个已确认且第二个收盘波谷价格>T1的波谷
    T1=(x1,c1), T2=(x2,c2)，support(x)=c1+(c2-c1)/(x2-x1)*(x-x1)。若最近3个已确认波谷收盘价严格递增，则
    confidence=HIGH；仅2个递增则 MEDIUM。belt_intact_tf = period_close >= support(current_index)。

    6）判定步骤：对D/W/M分别重采样并找收盘波谷；构造最近一段上升波谷连线；将线外推到当前周期；只比较“周期收盘价”与support，不使用盘中最低价。

