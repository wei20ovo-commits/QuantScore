    规范

    最大分值/扣分

    主启动形态最高+8

    自动化级别

    AUTO_PROXY

    规则来源

    用户补充定义：龙门突破后“假摔”只持续1个交易日；该日必须大成交量、跌幅很大、开盘接近涨停价、收盘接近跌停价；为避免把真实出货误判成假摔，V1增加后续恢复确认作为工程保护

    笔记依据

    笔记第7页 + 用户补充（v1.1）

    1）规则目的：把“鲤鱼跃龙门后的单日巨量假摔”与普通小阴回踩彻底区分，并通过后续恢复确认降低把真实崩跌/出货误判成正向形态的风险。

    2）所需数据：daily raw/adjusted OHLCV、M5、M60、真实 limit_up_price/limit_down_price、C5.platform_high。

    3）观察窗口：龙门突破日 t0 + 紧随其后的1个“假摔日” t1；恢复确认最多观察 t1 后1~3个交易日。假摔本体持续时间固定为1天。

    4）前置条件：先存在龙门突破 jump：dragon_level=max(C5.platform_high(若存在), M60, 最近20日有效压力位)；close[t0]>dragon_level
    且 t0 为强势突破日。

    5）精确定义/公式：fake_fall_day 必须为 t1=t0+1；open_near_limit_up = open_raw[t1] >= limit_up_price[t1]*0.98；close_near_limit_down
    = close_raw[t1] <= limit_down_price[t1]*1.02；large_drop = close_raw[t1]/open_raw[t1]-1
    <= -0.12（默认工程阈值，用于适配20%涨跌停板时仍要求显著大跌；同时若市场实际跌停幅度较小，以接近真实limit_down为主）；huge_volume
    = volume_ratio_20[t1]>=2.0 或 volume[t1]>=volume[t0]*1.5。fake_fall_signature =
    open_near_limit_up and close_near_limit_down and huge_volume。confirmation（工程保护）=
    t1后1~3日内至少一日 close>M5 且 close >= close[t1] + 0.5*(open[t1]-close[t1])，即至少收复假摔实体50%。

    6）判定步骤：确认龙门突破；只检查紧随次日是否满足“近涨停开盘→近跌停收盘→巨量”的单日假摔签名；满足时先标记CANDIDATE，不立即给满分；随后最多等3日观察是否重新站回M5并收复假摔实体至少一半。

    7）评分/扣分分档：

    8）失效与 UNKNOWN：t1不是紧随突破日=>本次模式不成立；缺真实涨跌停价=>UNKNOWN；fake_fall_signature成立但3日内未恢复=>INVALIDATED，不能正向计分，并交由高位/异常成交风险规则继续评估。

    9）冲突与去重规则：删除v1.0“假摔只是<=5%小阴且不能跌破龙门”的定义。假摔当日本身巨大成交不触发R12（R12仅T/一字板）；若处HIGH_ZONE仍可由R1/R2/R3独立给出风险。

    10）解释模板：龙门突破后次日开盘距涨停价 {open_gap_to_limit:.1%}、收盘距跌停价 {close_gap_to_downlimit:.1%}，量比
    {vr:.2f}；后续 {confirm_days} 日内收复假摔实体 {recover_ratio:.1%}，F1-Y 状态={status}，得 {score}/8
    分。








