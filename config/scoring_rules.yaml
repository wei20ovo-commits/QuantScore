    笔记依据

    笔记第6、21页 + 用户补充（v1.1）

    1）规则目的：分别在日线、周线、月线构造基于“收盘价波谷”的上升支持线，并严格用对应周期收盘价判断是否完整。

    2）所需数据：日线 close_adj；由日线聚合得到 weekly_close（每周最后一个交易日收盘）、monthly_close（每月最后一个交易日收盘）。low
