    笔记依据

    笔记第4页 + 用户补充（v1.1）

    1）规则目的：把“最先涨停、M5不破”的龙头定义直接转成日线可执行规则，不再用收益分位替代。

    2）所需数据：所属板块全部有效成分股的 daily OHLC、M5、真实 limit_up_price。

    3）观察窗口：默认搜索最近10个交易日作为“当前板块启动波段”的工程扫描窗口；10日只是实现窗口，不改变“最先涨停”的业务定义。

    4）前置条件：板块有效成分股>=10；各股涨停价可可靠取得；当前板块在该窗口内至少出现1只真实封涨停股票。

    5）精确定义/公式：is_limit_up[s,d] = close_raw[s,d] >= limit_up_price[s,d]*0.995；first_limit_day
    = min(d where any stock is_limit_up=True)；leader_candidate[s] = is_limit_up[s,first_limit_day]；leader_intact[s,t]
    = all(low_adj[s,k] >= M5[s,k] for k=first_limit_day+1..t)。同一天多只同时最先封板时，日线粒度无法排序，全部标记
    CO_LEADER。

    6）判定步骤：先对板块所有成分股逐日判断真实封涨停；找到窗口内最早封板日；确认目标股票是否在该日封板；再逐日检查该股最低价是否曾低于当日M5。

    7）评分/扣分分档：

    8）失效与 UNKNOWN：若目标股票在成为 leader/co-leader 后任一交易日 low_adj < M5，则立即 INVALIDATED、B3=0；缺板块全量成分股、涨停价或M5=>UNKNOWN。

    9）冲突与去重规则：B3只描述“本轮最先涨停且M5未破”的领涨资格；不得再用5日收益分位把非最先涨停股票升级成龙头。

    10）解释模板：本轮板块最早涨停日为 {first_limit_day}；目标股票{leader_text}最早涨停组，之后M5完整性={m5_intact}，B3
    得 {score}/3 分。







