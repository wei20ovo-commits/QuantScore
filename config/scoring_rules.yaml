        score: 8
        penalty: null
        status_tokens:
        - CONFIRMED
      - condition_spec: 假摔已发生且等待恢复
        award_spec: CANDIDATE 0
        score: 0
        penalty: null
        status_tokens:
        - CANDIDATE
      - condition_spec: 3日未恢复
        award_spec: 0 / INVALIDATED
        score: 0
        penalty: null
        status_tokens:
        - INVALIDATED
      - condition_spec: 非涨停强势突破量能定义待明确或关键数据不足
        award_spec: UNKNOWN
        score: null
        penalty: null
        status_tokens:
        - UNKNOWN
      inherited_spec_text_v1_1: '条件

        得分/扣分

        单日假摔签名成立，且1~3日内重新站回M5并收复实体>=50%

