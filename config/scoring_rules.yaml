- rule_id: B3
  name_cn: 板块内龙头代理
  name_en: First limit up leader proxy
  category: B
  rule_type: POSITIVE
  source_type: AUTO
  source_type_in_spec: AUTO
  max_score: 3
  max_penalty: 0
  required_fields:
  - 所属板块全部有效成分股的 daily OHLC、M5、真实 limit_up_price。
  lookback: 默认搜索最近10个交易日作为“当前板块启动波段”的工程扫描窗口；10日只是实现窗口，不改变“最先涨停”的业务定义。
  prerequisites:
  - 板块有效成分股>=10；各股涨停价可可靠取得；当前板块在该窗口内至少出现1只真实封涨停股票。
  parameters:
    ref: parameters.yaml#B3
    global_ref: parameters.yaml#GLOBAL
  status_values:
  - PASS
  - PARTIAL
  - FAIL
  - UNKNOWN
  - CANDIDATE
  - FORMED
  - CONFIRMED
  - INVALIDATED
  scoring_levels:
    spec_text: '条件

      得分/扣分

