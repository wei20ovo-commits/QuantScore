  - PASS
  - PARTIAL
  - FAIL
  - UNKNOWN
  - CANDIDATE
  - FORMED
  - CONFIRMED
  - INVALIDATED
  scoring_levels:
    spec_text: '条件

      得分/扣分

      > +2.0%

      +20

      +1.0% ~ +2.0%

      +16

      +0.5% ~ +1.0%

      +10

      0 ~ +0.5%

      +5

      <=0

      0'
    executable_parameters: parameters.yaml#S1
    levels:
    - condition_spec: '> +2.0%'
      award_spec: '+20'
      score: 20
      penalty: null
      status_tokens: []
    - condition_spec: +1.0% ~ +2.0%
      award_spec: '+16'
      score: 16
      penalty: null
      status_tokens: []
    - condition_spec: +0.5% ~ +1.0%
      award_spec: '+10'
      score: 10
      penalty: null
      status_tokens: []
    - condition_spec: 0 ~ +0.5%
      award_spec: '+5'
      score: 5
      penalty: null
      status_tokens: []
    - condition_spec: <=0
      award_spec: '0'
      score: 0
      penalty: null
      status_tokens: []
  invalidation_rules:
  - 板块或基准缺数据=>UNKNOWN。
  unknown_conditions:
  - 板块或基准缺数据=>UNKNOWN。
  conflict_rules:
  - 不得与S2合并；两个时间尺度分别表达“当天爆发”和“持续性”。
  explanation_template: 板块当日跑赢大盘 {excess_1d:.2%}，对应 S1 得 {score}/20 分。
