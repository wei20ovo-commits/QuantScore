    笔记依据

    笔记第6、21页 + 用户补充（v1.1）

    1）规则目的：严格按C6的日/周/月收盘安全带判断破位；取消v1.0“盘中破位警告”和“两日确认”逻辑。

    2）所需数据：C6.daily_support / weekly_support / monthly_support；对应周期close。盘中low仅用于展示，不参与破位判定。

    3）观察窗口：当前已完成的日/周/月周期。

    4）前置条件：对应时间尺度C6安全带曾经CONFIRMED且当前support可外推。

    5）精确定义/公式：broken_tf = completed_period_close_tf < support_tf(current_period)。不设2%或1%宽松带；仅可在代码中使用极小数值epsilon处理浮点误差（<=0.1%，必须配置且不得展示成交易容差）。日内/周内/月内
    low<support 但对应周期close>=support => NOT_BROKEN。

    6）判定步骤：D/W/M逐一读取“已完成周期的最终收盘价”；与对应安全带比较；某周期收盘首次低于support即把该周期安全带标记INVALIDATED。

    7）评分/扣分分档：

    8）失效与 UNKNOWN：安全带尚未形成=>NOT_APPLICABLE；周/月周期未结束=>PENDING；盘中低点跌破但收盘收回=>0，不警告、不扣分。

