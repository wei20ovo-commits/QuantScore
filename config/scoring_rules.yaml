      spec_text: '条件

        得分/扣分

        共同龙门强势突破、次日近涨停开近跌停收巨量、3日内恢复M5及实体50%

        +8 / CONFIRMED

        假摔已发生且等待恢复

        CANDIDATE 0

        3日未恢复

        0 / INVALIDATED

        非涨停强势突破量能定义待明确或关键数据不足

        UNKNOWN'
      executable_parameters: parameters.yaml#F1-Y
      levels:
      - condition_spec: 共同龙门强势突破、次日近涨停开近跌停收巨量、3日内恢复M5及实体50%
