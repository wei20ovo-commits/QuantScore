    T02_NEW：平台先形成；第6日Close<M60则原平台INVALIDATED且0分；2日后强势收复可由C4命中，但C5不立即成立；收复后4日仍0，第5日满足条件后新平台+4。所有旧C5洗盘并入同一平台文字均为SUPERSEDED_BY_V1_3。'
  inherited_override_v1_2: '正式冻结：


    平台至少持续：


    5个交易日。


    平台期间：


    每个交易日收盘价必须：


    Close >= M60


    只要任一交易日：


    Close < M60


    该段不能被认定为“完整M60起飞平台”。


    注意：


    用户过去提到“主力可能故意跌破M60后1~3日重新收回”。


    这种情况归 C4：


    M60快速收复


    不要再算 C5 完整起飞平台。


    “在M60上方一点点”工程化定义：


    0 <= (Close - M60) / M60 <= 8%


    参数：


    m60_platform_max_distance_pct = 0.08


    最近至少5日中：


    至少80%的交易日满足上述距离条件，

    且100%的收盘价不得低于M60。


    平台振幅可以存在，

    不要擅自要求成交量一定缩小或突破必须放量。


    实现 C5。'
