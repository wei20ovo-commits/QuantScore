    unknown_conditions:
    - t1不是紧随突破日=>本次模式不成立；缺真实涨跌停价=>UNKNOWN；fake_fall_signature成立但3日内未恢复=>INVALIDATED，不能正向计分，并交由高位/异常成交风险规则继续评估。
