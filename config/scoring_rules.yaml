    规范

    最大分值/扣分

    最高-10

    自动化级别

    AUTO_PROXY

    规则来源

    用户补充定义：“该涨不涨”不是单个压力位概念，而是按照本套笔记/QuantScore此前评分本应走强，但随后实际没有上涨

    笔记依据

    笔记第20页 + 用户补充（v1.1）

    1）规则目的：把“按此前评分应该涨、结果没涨”转成一个严格的滞后验证规则；它是对高匹配信号的事后失败反馈，不允许在信号当天凭感觉触发。

    2）所需数据：评价日t0的 PositiveScore、RiskPenalty（排除R7本身）、PositiveCoverage、各规则明细，以及t0后1~3个交易日OHLC。

    3）观察窗口：信号日t0后的3个交易日。新近信号不足3个后续交易日时状态=PENDING，不得提前扣分。

    4）前置条件：t0 的 PositiveScore>=70；PositiveCoverage>=80%；RiskPenalty_without_R7<8（LOW）；且t0至少存在一个明确的趋势/启动/板块正向信号（B、C、F任一非零），才定义为“按照本体系应该走强的高匹配信号”。70/80%/8为V1工程阈值，必须配置化。

    5）精确定义/公式：close_ret_i=close[t0+i]/close[t0]-1, i=1..3；max_close_ret=max(close_ret_1..3)；end_ret=close[t0+3]/close[t0]-1。NOT_RISE_STRONG
    = max_close_ret<=0；NOT_RISE_WEAK = max_close_ret<0.02。R7只在完整3日观察结束后判定。

    6）判定步骤：冻结t0当日的评分快照（禁止用未来数据重算t0）；等满3个交易日后读取后续收盘表现；若3日内从未出现至少2%的收盘上涨，则判“该涨不涨”；若完全没有任何收盘上涨，判更严重。

    7）评分/扣分分档：

    8）失效与 UNKNOWN：t0后不足3日=>PENDING；t0评分覆盖不足/不是高匹配信号=>NOT_APPLICABLE；后续3日内任一收盘涨幅>=2%=>INVALIDATED/0。

    9）冲突与去重规则：R7必须基于“历史冻结评分快照”运行，绝不能把后3日数据反向写入t0的正向规则；实时自动选股对当天新信号不应用R7，只能检查更早已满3日观察期的信号。

    10）解释模板：{signal_date} 的正向匹配分 {positive_score}、风险扣分 {risk_penalty}、覆盖率 {coverage:.0%}；随后3日最大收盘涨幅仅
