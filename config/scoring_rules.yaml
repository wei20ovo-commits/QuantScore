  - R4只评价价格结构；大成交/换手由R1/R2另评。
  explanation_template: 两个高位局部顶部相隔 {days} 日，高度差 {peak_diff:.1%}，中间回撤 {drawdown:.1%}；状态={status}，R4
    扣 {penalty} 分。
  spec_version: '1.4'
  spec_status: FROZEN_V1_4
  code_status: IMPLEMENTED
  evaluator: app.rules.patterns.double_top:r4
  definition: '保留已有完整双子顶算法。


    如果同一窗口存在多个合法双子顶：


    必须选择：


    P2距离当前评价日最近的一组。


    如果多个结构 P2 日期相同：


    选择：


    abs(P2_high - P1_high)


    最小的一组，

    即两个顶部高度最接近者。


    不再因为 multiple double-top candidates 返回 UNKNOWN。


    双子顶状态和扣分继续保留：


    CANDIDATE：

    按规范扣分


    FORMED：

    按规范进一步扣分


    CONFIRMED：

    按规范最高等级扣分


    一旦检测到双子顶：


    至少从 CANDIDATE 开始，

    必须生成：


    exit_risk_alert = true


    alert_type = "DOUBLE_TOP_EXIT_RISK"


    UI未来展示文本：


    “检测到双子顶卖出风险信号，请重点关注顶部结构及破位风险。”


    注意：

    这是用户自定义交易规则的风险提醒，

    不是自动下单功能。


    如果后续满足 INVALIDATED：

    撤销该双子顶风险和相应扣分。


    补：

    多组候选

    最近P2优先

    同P2峰差优先

    风险提醒

    失效撤销

    测试。'
  steps: 找P1/P2；检查高位/前期涨幅；检查顶部高度、间隔和中间回撤；判断P2后转弱及颈线破位。
  source_note: 笔记第17页
  source_text: '字段

    规范

    最大分值/扣分

    最高-12

    自动化级别

    AUTO_PROXY

    规则来源

    笔记：高位双子顶、第二顶不超前顶，常伴大投量/大换手；价格结构单独识别

    笔记依据

    笔记第17页


    1）规则目的：识别一轮上涨后两个相近顶部、第二次未有效突破并进一步破位的结构。

    2）所需数据：

    daily OHLC

    M5

    3）观察窗口：最近40~60日

    4）前置条件：

    至少30日数据；两个顶部中至少一个位于高位区或P1前20日涨幅>=15%

    5）精确定义/公式：

    LOCAL_PEAK: high[t]为前后2日共5日最高

    4<=days(P1,P2)<=20

    peak_diff=abs(high[P2]-high[P1])/high[P1] <=3%

    Valley=min(low[P1+1:P2-1])

    valley_drawdown=(min(high[P1],high[P2])-Valley)/min(high[P1],high[P2]) >=5%

    有效突破失效条件: close[P2] > high[P1]*1.03

    neckline=Valley

    6）判定步骤：

    找P1/P2；检查高位/前期涨幅；检查顶部高度、间隔和中间回撤；判断P2后转弱及颈线破位。

    7）评分/扣分分档：

    条件

    得分/扣分

    结构满足但P2后尚未走弱：CANDIDATE

    -4

    P2后3日内 close<M5 或较P2收盘跌>=3%：FORMED

    -8

    P2后 close<neckline：CONFIRMED

    -12

    连续2日close>high[P1]*1.03：INVALIDATED

    0


    8）失效与 UNKNOWN：

    历史不足=>UNKNOWN；P2为最新日且无后续数据只能CANDIDATE；复权口径不一致=>UNKNOWN。

    9）冲突与去重规则：

    R4只评价价格结构；大成交/换手由R1/R2另评。

    10）解释模板：

    两个高位局部顶部相隔 {days} 日，高度差 {peak_diff:.1%}，中间回撤 {drawdown:.1%}；状态={status}，R4 扣 {penalty}
    分。'
