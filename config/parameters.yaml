    Low <= limit_up_price * 0.98


    即最低价至少比涨停价低2%。


    4. 最终重新封住涨停。


    满足：

    完整T板。


    不要额外要求：

    Open必须涨停。


    成交量是否异常：

    由 D 类和 R12 单独判断，

    不要在F1-T重复扣分。


