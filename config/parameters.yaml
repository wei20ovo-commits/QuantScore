C5:
  search_days_max: 250
  minimum_samples: 5
  spec_definition: '连续至少5个交易日，100%收盘Close>=M60，至少80%日满足0<=Close/M60-1<=8%；不增加成交量条件。platform_high为该连续有效平台段的最高High。

    任一日Close<M60，旧平台立即INVALIDATED、正分清零。TERMINATED仅为历史描述，不新增统一状态枚举。跌破日及后续收复不能并入原平台；重新站上后从当日重新累计，新平台必须再次连续>=5日。

    1~3日快速收复仅交C4按其原有完整条件判断，不修改C4的阈值、强度或确认规则。新C5只有4日时不得得分；第5日重新满足条件才得4分。保留最近跌破日期、旧平台起止日期、新段起点和连续长度。

    T02_NEW：平台先形成；第6日Close<M60则原平台INVALIDATED且0分；2日后强势收复可由C4命中，但C5不立即成立；收复后4日仍0，第5日满足条件后新平台+4。所有旧C5洗盘并入同一平台文字均为SUPERSEDED_BY_V1_3。'
  spec_scoring_levels: '条件

    得分/扣分

    连续>=5日全close>=M60且至少80%距M60<=8%

    +4

    旧平台任一收盘跌破M60

    INVALIDATED 0

    收复后新连续段不足5日或无平台

    0

    M60历史或必要数据不足

    UNKNOWN'
  m60_platform_max_distance_pct: 0.08
  near_fraction_min: 0.8
  scores:
  - 0
  - 4
C6:
  daily_trough_side_bars: 2
  weekly_monthly_trough_side_bars: 2
  float_epsilon: 0
  search_days: 120
  search_weeks: 52
  search_months: 36
  spec_definition: '用户定义：


    安全带分别存在于：


    日K

    周K

    月K


    每个周期都使用：


    “收盘价形成的波谷”


    不是最低价 Low。


    安全带由至少两个已确认的收盘价局部波谷连线形成。


    局部收盘波谷：

    当前周期 Close 小于前后各2根K线的 Close。


    最近两个已确认波谷：

    按时间最近的两个有效波谷建立上升支撑线。


    只有：


    第二个波谷收盘价 > 第一个波谷收盘价


    才属于上升安全带。


    将两点连线外推到当前评价周期。


    判断破位时：


    盘中 Low 跌破安全带但 Close 收回：

    不算失效。


    只有当前周期：


    Close < 安全带价格


    才判该周期安全带跌破。


    日K：

    使用日收盘。


    周K：

    只能在完整周线收盘后确认。


    月K：

    只能在完整月线收盘后确认。


    任何周期出现正式收盘跌破：

    对应安全带 INVALIDATED。


    R8执行规范中的风险扣分。


    不能用 Low 代替 Close。


    实现 C6 和 R8。'
  spec_scoring_levels: '条件

    得分/扣分

    日线安全带未被周期收盘跌破

    +1

    完整周线安全带未被周期收盘跌破

    +1

    完整月线安全带未被周期收盘跌破

    +1

    对应周期收盘跌破

    0 / INVALIDATED

    数据或完整周期不足

    UNKNOWN'
  scores_per_tf: 1
