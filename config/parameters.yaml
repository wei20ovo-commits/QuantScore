E2:
  high_zone_week_radius: 2
  bottom_position_max: 0.35
  search_weeks: 52
  minimum_weeks: 20
  spec_definition: "使用完整周K。\n\n步骤：\n\n1. 找到上一轮主要价格高点；\n2. 以上一轮主要高点所在周为中心；\n3. 搜索：\n\
    \   高点前2周\n   高点周\n   高点后2周\n   共最多5周；\n4. 在这5周内找到最大周成交量：\n\nprevious_cycle_peak_volume\n\
    \n该周不要求与最高价发生在完全同一周。\n\n底部阶段缩量持续时间：\n不设固定长度。\n\n当前底部区域只要某完整周：\n\nweekly_volume\
    \ > previous_cycle_peak_volume\n\n即满足：\n\n周线成交量反转。\n\n不得擅自要求：\n必须连续放量\n必须先缩量N周\n\
    必须ATR收缩。\n\n若存在多个上一轮主要高点：\n\n优先选择距离当前评价日最近的、已结束的上一轮主要价格高点。\n\n实现 E2。"
  spec_scoring_levels: '条件

    得分/扣分

    底部完整周成交量>高点前后各2周最大周量

    +4 / CONFIRMED

    底部但周量未超过参考量

    CANDIDATE 0

    非底部或没有前轮高点

    0

    完整周数据不足

    UNKNOWN'
  scores:
  - 0
  - 4
E3:
  full_volume_ratio: 1.15
  spec_definition: '用户定义：


    阻尼运动不要求振幅越来越小。


    核心只有：


    1. 股价处于小幅波动；

    2. 上涨时放量；

    3. 下跌时缩量。


    “小幅波动”工程定义：


    观察窗口内至少80%的交易日：


    abs(daily_return) <= 5%


    参数：


    damping_small_move_pct = 0.05


    上涨日：


    daily_return > 0


    下跌日：


    daily_return < 0


    计算：


    avg_up_volume

    avg_down_volume


    必须：


    avg_up_volume > avg_down_volume


    才满足量价方向要求。


    不设置固定持续天数。


    程序需要在已有可用窗口内进行检测，

    但至少要有：


    3个上涨日

    3个下跌日


    否则证据不足返回 UNKNOWN。


    不要重新加入“振幅持续收窄”的旧规则。


    实现 E3。'
  spec_scoring_levels: '条件

    得分/扣分

    小幅波动且上涨均量/下跌均量>=1.15

    +3

    小幅波动且1<上涨均量/下跌均量<1.15

    +2

    样本充分但价格/量价方向不成立

    0

    上涨/下跌各3日证据不足

    UNKNOWN'
  damping_small_move_pct: 0.05
  small_move_fraction_min: 0.8
  minimum_group: 3
  scores:
  - 0
  - 2
  - 3
F1-N:
  exchange_days_min: 2
  exchange_days_max: 6
  search_days: 20
  first_return: 0.07
  volume_min: 1.2
  breakout_margin: 0.01
  scores:
  - 0
  - 4
  - 10
  m5_break_rule: low_adj < M5 => INVALIDATED; no recovery
  spec_definition: '用户确认：


    换手期间任意一天：


    Low < M5


    即立即失效。


    即使当天最终：


    Close > M5


    仍然失效。


    换手最长：


    6个交易日。


    如果窗口内存在多个可能 first_start：


    按照 first_start 距评价日由近到远排序。


    优先选择：


    距离当前最近，

    且完整满足：


    首次启动

    → 2~6日换手

    → 换手任何一天Low不得低于M5

    → 二次启动


    的完整结构。


    如果最近候选失败：

    继续向前检查下一候选。


    如果找到一个完整合法结构：

    使用距离当前最近的合法结构。


    不要因为 multiple first_start 返回 UNKNOWN。


    将 F1-N 从 PARTIAL 尽量升级到 IMPLEMENTED。


    补多起点测试。'
  spec_scoring_levels: '条件

    得分/扣分

    合法启动后2~6日换手low始终>=M5且二次启动

    +10 / CONFIRMED

    合法换手>=2日且尚未再启动

    CANDIDATE +4

    任一换手日low<M5

    0 / INVALIDATED

    超过6日仍未再启动

    0 / INVALIDATED

    关键数据/后续观察不足

    UNKNOWN'
F1-T:
