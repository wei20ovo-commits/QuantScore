[project]
name = "quantscore"
version = "0.2.0"
description = "Explainable technical strategy matching; specification v1.4"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "PyYAML>=6,<7", "akshare==1.18.97", "fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1", "baostock==0.9.4", "streamlit==1.64.0", "plotly==7.1.0", "numpy>=1.26,<3", "requests>=2.32,<3"]

[project.scripts]
quantscore = "app.cli:main"

[project.optional-dependencies]
tushare = ["tushare>=1.4,<2"]
test = ["pytest>=9,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
